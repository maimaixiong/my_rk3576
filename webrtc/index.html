<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RK3576 远端图像</title>
<style>
  body { margin:0; background:#111; color:#ddd; font-family:system-ui,sans-serif; }
  #wrap { max-width:960px; margin:0 auto; padding:16px; }
  h1 { font-size:18px; color:#fff; }
  video { width:100%; background:#000; border-radius:8px; }
  #status { font-size:13px; margin:8px 0; color:#8f8; }
  #status.err { color:#f88; }
  .row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  button { background:#2a6; color:#fff; border:0; padding:8px 16px; border-radius:6px; font-size:14px; cursor:pointer; }
  button:disabled { background:#555; cursor:default; }
  #info { font-size:12px; color:#999; margin-top:6px; }
  .meter-wrap { margin:10px 0; }
  .meter-label { font-size:13px; color:#aaa; margin-bottom:4px; }
  .meter-bar { height:18px; background:#222; border-radius:4px; overflow:hidden; }
  .meter-fill { height:100%; width:0%; background:linear-gradient(90deg,#0a6,#2c8,#4c4); transition:width .1s; }
  .meter-db { font-size:20px; font-weight:bold; color:#fff; margin-left:8px; font-family:monospace; }
  .meter-state { font-size:13px; margin-top:3px; }
  .meter-state.ok { color:#8f8; }
  #chatpanel { margin-top:12px; background:#1a1f2a; border-radius:8px; padding:10px 14px; }
  #chatpanel h3 { margin:0 0 8px; font-size:14px; color:#fff; }
  #chatlog { height:180px; overflow-y:auto; font-size:13px; color:#ddd; margin-bottom:8px; padding:4px; background:#141820; border-radius:6px; }
  #chatlog .user { color:#8cf; }
  #chatlog .ai { color:#8f8; }
  #chatlog .meta { color:#666; font-size:11px; }
  #chatinput { display:flex; gap:6px; }
  #chattext { flex:1; padding:6px; border-radius:6px; border:0; background:#222; color:#fff; }
  #chatsend { padding:6px 14px; border:0; border-radius:6px; background:#2a6; color:#fff; cursor:pointer; }
  #syspanel { margin-top:12px; background:#1a1f2a; border-radius:8px; padding:10px 14px; font-size:13px; }
  #syspanel h3 { margin:0 0 8px; font-size:14px; color:#fff; }
  .sys-row { display:flex; justify-content:space-between; padding:2px 0; color:#bbb; }
  .sys-row span:last-child { color:#8f8; font-family:monospace; }
  .loadbar { height:6px; background:#222; border-radius:3px; margin:2px 0 6px; }
  .loadbar-fill { height:100%; border-radius:3px; transition:width .5s; }
  .loadbar-fill.low { background:#4c4; }
  .loadbar-fill.mid { background:#fc0; }
  .loadbar-fill.high { background:#f44; }
  #temps { display:flex; flex-wrap:wrap; gap:4px 14px; margin:4px 0; }
  #temps span { color:#9cf; font-family:monospace; }
  .meter-state.no { color:#f88; }
</style>
</head>
<body>
<div id="wrap">
  <h1>RK3576 实时视频+音频（WebRTC）</h1>
  <div class="row">
    <button id="btnConn" onclick="toggleConn()">连接</button>
    <span id="status">未连接</span>
  </div>
  <div style="position:relative">
    <video id="video" autoplay playsinline muted controls></video>
    <canvas id="ovl" style="position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none"></canvas>
  </div>
  <audio id="audio" autoplay controls style="width:100%;margin-top:8px"></audio>
  <div class="meter-wrap">
    <div class="meter-label">🎙️ 板子麦克风声压 <span class="meter-db" id="micdb">-∞ dB</span></div>
    <div class="meter-bar"><div class="meter-fill" id="micfill"></div></div>
    <div class="meter-state no" id="micstate">⏳ 等待信号…（外接麦克风后此处跳动）</div>
  </div>
  <div class="meter-wrap">
    <div class="meter-label">🔊 浏览器播放电平</div>
    <div class="meter-bar"><div class="meter-fill" id="plfill"></div></div>
  </div>
  <div id="vidstate" style="font-size:13px;color:#8f8;margin-top:6px">等待视频...</div>
  <div id="detstate" style="font-size:13px;color:#f80;margin-top:4px"></div>
  <div id="chatpanel">
    <h3>💬 问设备（AI Agent）
      <button id="voicebtn" onclick="startVoice(this)" style="padding:4px 10px;border:0;border-radius:6px;background:#c30;color:#fff;cursor:pointer">🎤 按住说话</button>
      <div id="voicelevel" style="display:inline-block;width:100px;height:10px;background:#222;border-radius:5px;margin-left:8px;vertical-align:middle;overflow:hidden">
        <div id="voicelevelfill" style="width:0%;height:100%;background:linear-gradient(90deg,#4c4,#fc0,#f44)"></div>
      </div>
      <span id="voicestate" style="font-size:11px;color:#999"></span>
    </h3>
    <div id="chatlog"></div>
    <div id="chatinput">
      <input id="chattext" placeholder="问设备：画面里有什么？设备温度？" onkeydown="if(event.key==='Enter')sendChat()">
      <button id="chatsend" onclick="sendChat()">发送</button>
    </div>
  </div>
  <div id="syspanel">
    <h3>📊 系统状态 <span id="sysfps" style="float:right;color:#ff8"></span></h3>
    <div class="sys-row"><span>🌡️ 温度</span><span id="tempavg"></span></div>
    <div id="temps"></div>
    <div class="sys-row"><span>⚡ CPU</span><span id="cpupct">-</span></div>
    <div class="loadbar"><div class="loadbar-fill" id="cpubar" style="width:0%"></div></div>
    <div class="sys-row"><span>🎮 GPU</span><span id="gpupct">-</span></div>
    <div class="loadbar"><div class="loadbar-fill" id="gpubar" style="width:0%"></div></div>
    <div class="sys-row"><span>🧠 NPU</span><span id="npupct">-</span></div>
    <div class="loadbar"><div class="loadbar-fill" id="npubar" style="width:0%"></div></div>
  </div>
  <div id="audiolvl" style="font-size:13px;color:#fc8;margin-top:6px"></div>
  <div id="info"></div>
</div>

<script>
let pc = null, ws = null, connected = false;

const status = document.getElementById('status');
const video = document.getElementById('video');
const btn = document.getElementById('btnConn');

function setStatus(text, err=false) {
  status.textContent = text;
  status.className = err ? 'err' : '';
}

function send(obj) {
  if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify(obj));
}

async function toggleConn() {
  if (connected) { await closeAll(); return; }
  await setup();
}

async function setup() {
  try {
    pc = new RTCPeerConnection({ iceServers: [] });   // 局域网直连
    pc.addTransceiver('video', { direction: 'recvonly' });
    // 双向音频：浏览器麦克风 → 板子喇叭（需 https，本页已启用）
    try {
      const micStream = await navigator.mediaDevices.getUserMedia({ audio: true });
      micStream.getAudioTracks().forEach(t => pc.addTrack(t));
      document.getElementById('audiolvl').textContent = '🎤 已连接本机麦克风（对讲模式）';
    } catch (e) {
      document.getElementById('audiolvl').textContent = '⚠️ 无法访问本机麦克风: ' + e.message;
    }

    pc.onicecandidate = e => {
      if (e.candidate) send({ type:'ice', candidate: e.candidate.candidate });
    };
    pc.ontrack = e => {
      if (e.track.kind === 'video') {
        video.srcObject = e.streams[0];
        video.addEventListener('loadeddata', () => {
          setStatus('视频已解码: ' + video.videoWidth + 'x' + video.videoHeight);
          document.getElementById('vidstate').textContent = '✅ 视频解码中 ' + video.videoWidth + 'x' + video.videoHeight;
        });
        video.addEventListener('error', () => {
          document.getElementById('vidstate').textContent = '❌ 视频错误: ' + video.error + ' (' + video.error && video.error.message + ')';
          setStatus('视频解码错误', true);
        });
        setStatus('已建立连接，等待视频解码...');
        video.play().catch(()=>{});
      } else if (e.track.kind === 'audio') {
        audio.srcObject = e.streams[0];
        audio.play().catch(()=>{});
      }
    };
    pc.onconnectionstatechange = () => {
      setStatus('连接状态: ' + pc.connectionState);
      if (pc.connectionState === 'failed' || pc.connectionState === 'closed') {
        connected = false; btn.textContent = '连接';
      }
    };

    const host = location.hostname || location.host;
    const isHttps = location.protocol === 'https:';
    const wsProto = isHttps ? 'wss' : 'ws';
    const wsPort = isHttps ? 8084 : 8081;
    ws = new WebSocket(`${wsProto}://${host}:${wsPort}`);
    ws.onopen = () => { setStatus('信令已连接，等待 offer...'); send({type:'join'}); };
    ws.onmessage = async ev => {
      const msg = JSON.parse(ev.data);
      if (msg.type === 'offer') {
        setStatus('收到 offer，应答中...');
        await pc.setRemoteDescription({ type:'offer', sdp: msg.sdp });
        const answer = await pc.createAnswer();
        await pc.setLocalDescription(answer);
        send({ type:'answer', sdp: answer.sdp });
      } else if (msg.type === 'ice') {
        try { await pc.addIceCandidate({ candidate: msg.candidate, sdpMLineIndex: msg.mlineindex || 0 }); }
        catch(e) { console.warn('ICE 添加失败', e); }
      } else if (msg.type === 'detect') {
        const objs = msg.objects || [];
        drawDetections(objs);
        const st = document.getElementById('detstate');
        if (!objs.length && !st.textContent.startsWith('🔍')) {
          st.textContent = '🟢 检测运行中（当前画面未发现目标）';
        }
      } else if (msg.type === 'stats') {
        updateSysPanel(msg);
      } else if (msg.type === 'voice_text') {
        // 精确更新语音占位为识别文本
        if (voiceUserDiv) {
          voiceUserDiv.textContent = '🎤 ' + msg.text;
          voiceUserDiv.className = 'user';
          voiceUserDiv = null;
        }
        addChat('AI', '(思考中…)');
      } else if (msg.type === 'chat_reply') {
        // 移除"思考中"占位再显示回复
        const last = chatlog.lastElementChild;
        if (last && last.textContent.includes('思考中')) last.remove();
        addChat('AI', msg.text || '');
        // 用 Mac Speaker 朗读（Web Speech API）
        speak(msg.text || '');
      } else if (msg.type === 'audio_meter') {
        // 声压仪表：-60dB 显示 0%，-6dB 显示 100%
        const pct = Math.max(0, Math.min(100, (msg.db + 60) / 54 * 100));
        document.getElementById('micfill').style.width = pct + '%';
        document.getElementById('micdb').textContent = msg.db + ' dB';
        const st = document.getElementById('micstate');
        if (msg.db < -45) {
          st.textContent = '❌ 无麦克风信号（RMS=' + msg.rms + '）— 请检查板子麦克风';
          st.className = 'meter-state no';
        } else if (msg.db < -30) {
          st.textContent = '⚠️ 信号微弱';
          st.className = 'meter-state no';
        } else {
          st.textContent = '✅ 检测到声音';
          st.className = 'meter-state ok';
        }
      }
    };
    ws.onclose = () => { setStatus('信令断开', true); };
    ws.onerror = () => { setStatus('信令错误', true); };

    connected = true;
    btn.textContent = '断开';
    setStatus('等待信令连接...');
  } catch (e) {
    setStatus('初始化失败: ' + e.message, true);
  }
}

async function closeAll() {
  connected = false; btn.textContent = '连接';
  if (pc) { pc.close(); pc = null; }
  if (ws) { ws.close(); ws = null; }
  video.srcObject = null;
  audio.srcObject = null;
  setStatus('已断开');
}

// 系统监控面板更新（秒级）
function updateSysPanel(s) {
  document.getElementById('sysfps').textContent = '🖥️ ' + (s.fps||0) + ' fps';
  const temps = s.temps || {};
  const tv = document.getElementById('temps');
  tv.innerHTML = '';
  let sum = 0, cnt = 0;
  for (const [k,v] of Object.entries(temps)) {
    tv.innerHTML += '<span>' + k + ': ' + v + '°C</span>';
    sum += v; cnt++;
  }
  document.getElementById('tempavg').textContent = cnt ? (sum/cnt).toFixed(0) + '°C (均)' : '-';
  const setBar = (id, pct) => {
    const el = document.getElementById(id);
    el.style.width = pct + '%';
    el.className = 'loadbar-fill ' + (pct < 50 ? 'low' : pct < 80 ? 'mid' : 'high');
  };
  document.getElementById('cpupct').textContent = (s.cpu||0) + '%';
  setBar('cpubar', s.cpu||0);
  document.getElementById('gpupct').textContent = (s.gpu||0) + '%';
  setBar('gpubar', s.gpu||0);
  document.getElementById('npupct').textContent = (s.npu||0) + '%';
  setBar('npubar', s.npu||0);
}

// YOLO 检测框绘制（box 相对 1280x720 视频帧）
const ovl = document.getElementById('ovl');
const LABEL_COLORS = {};
function drawDetections(objs) {
  const v = document.getElementById('video');
  if (v.videoWidth === 0) return;
  ovl.width = v.clientWidth; ovl.height = v.clientHeight;
  const ctx = ovl.getContext('2d');
  ctx.clearRect(0, 0, ovl.width, ovl.height);
  const sx = ovl.width / 1280, sy = ovl.height / 720;
  const n = document.getElementById('detstate');
  if (!objs.length) { n.textContent = ''; return; }
  n.textContent = '🔍 检测到: ' + objs.map(o => o.label + ' ' + o.conf).join('  ');
  objs.forEach(o => {
    if (!LABEL_COLORS[o.label]) LABEL_COLORS[o.label] =
      '#' + Math.floor(Math.random()*0xffffff).toString(16).padStart(6,'0');
    const [x1,y1,x2,y2] = o.box;
    ctx.strokeStyle = LABEL_COLORS[o.label];
    ctx.lineWidth = 2;
    ctx.strokeRect(x1*sx, y1*sy, (x2-x1)*sx, (y2-y1)*sy);
    ctx.fillStyle = LABEL_COLORS[o.label];
    ctx.font = '14px sans-serif';
    ctx.fillText(o.label + ' ' + o.conf, x1*sx, Math.max(14, y1*sy-5));
  });
}
setInterval(() => { ovl.width = ovl.width; }, 1000);  // 防残留

// 对话功能（参考 CarWatch 的 ask 模式）
const chatlog = document.getElementById('chatlog');
function addChat(role, text) {
  const d = document.createElement('div');
  d.className = role === 'AI' ? 'ai' : 'user';
  d.textContent = (role === 'AI' ? '🤖 ' : '🧑 ') + text;
  chatlog.appendChild(d);
  chatlog.scrollTop = chatlog.scrollHeight;
  return d;   // 返回元素（语音占位更新用）
}
function sendChat() {
  const inp = document.getElementById('chattext');
  const t = inp.value.trim();
  if (!t) return;
  addChat('user', t);
  inp.value = '';
  addChat('AI', '(思考中…)');
  send({ type: 'chat', text: t });
  // 简单滚动：最后一条等待替换——这里简化，AI 回复走 chat_reply 追加
}
// 移除"思考中"占位（简单处理：chat_reply 直接追加，占位保留作为 loading）

// 语音功能：按住录音（防重复 + 声压指示）→ WS → 板子 STT → Agent
let mediaRec = null, voiceChunks = [], voiceStream = null;
let voiceActive = false, voiceSeq = 0, voiceUserDiv = null;
let voiceAnalyser = null, voiceCtx = null, voiceLevelTimer = null;
const VAD_TIMEOUT = 12;

async function startVoice(btn) {
  if (voiceActive) return;   // 防重复启动
  if (location.protocol !== 'https:') {
    addChat('AI', '(语音需 HTTPS：请访问 https://192.168.2.100:8443 并允许证书)');
    return;
  }
  if (!navigator.mediaDevices || !window.MediaRecorder) {
    addChat('AI', '(浏览器不支持录音，需 HTTPS + Chrome/Edge)');
    return;
  }
  try {
    voiceStream = await navigator.mediaDevices.getUserMedia({ audio: true });
    voiceActive = true;
    mediaRec = new MediaRecorder(voiceStream);
    voiceChunks = [];
    mediaRec.ondataavailable = e => voiceChunks.push(e.data);
    mediaRec.onstop = handleVoiceStop;
    mediaRec.start();
    startVoiceLevel();
    btn.textContent = '🔴 松开发送';
    btn.style.background = '#f00';
    document.getElementById('voicestate').textContent = '● 录音中';
    btn.onmouseup = btn.ontouchend = () => stopVoice(btn);
    setTimeout(() => { if (voiceActive) stopVoice(btn); }, VAD_TIMEOUT * 1000);
  } catch (e) {
    addChat('AI', '(麦克风授权失败: ' + e.message + ')');
  }
}

function stopVoice(btn) {
  if (!voiceActive) return;   // 防重复停止（mouseup+touchend 双触发）
  if (mediaRec && mediaRec.state === 'recording') mediaRec.stop();  // onstop 会调 handleVoiceStop
}

function handleVoiceStop() {
  if (!voiceActive) return;
  voiceActive = false;
  stopVoiceLevel();
  if (voiceStream) voiceStream.getTracks().forEach(t => t.stop());
  const btn = document.getElementById('voicebtn');
  btn.textContent = '🎤 按住说话';
  btn.style.background = '#c30';
  btn.onmouseup = btn.ontouchend = null;
  document.getElementById('voicestate').textContent = '';
  const blob = new Blob(voiceChunks, { type: 'audio/webm' });
  const reader = new FileReader();
  reader.onload = () => {
    voiceSeq++;
    const seq = voiceSeq;
    send({ type: 'voice', audio: reader.result.split(',')[1], seq: seq });
    // 用户消息占位（精确更新用）
    voiceUserDiv = addChat('user', '🎤 (语音识别中…)');
    addChat('AI', '(思考中…)');
  };
  reader.readAsDataURL(blob);
}

// 声压指示（录音时实时）
function startVoiceLevel() {
  voiceCtx = new (window.AudioContext || window.webkitAudioContext)();
  voiceAnalyser = voiceCtx.createAnalyser();
  voiceAnalyser.fftSize = 512;
  voiceCtx.createMediaStreamSource(voiceStream).connect(voiceAnalyser);
  const data = new Uint8Array(voiceAnalyser.frequencyBinCount);
  voiceLevelTimer = setInterval(() => {
    voiceAnalyser.getByteTimeDomainData(data);
    let peak = 0;
    for (let i = 0; i < data.length; i++) {
      const v = Math.abs(data[i] - 128) / 128;
      if (v > peak) peak = v;
    }
    document.getElementById('voicelevelfill').style.width = (peak * 100) + '%';
  }, 100);
}
function stopVoiceLevel() {
  if (voiceLevelTimer) clearInterval(voiceLevelTimer);
  if (voiceCtx) voiceCtx.close();
  document.getElementById('voicelevelfill').style.width = '0%';
}

// Mac Speaker TTS
function speak(text) {
  if (!window.speechSynthesis) return;
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text.replace(/[()（）：:]/g, ' '));
  u.lang = 'zh-CN';
  u.rate = 1.0;
  // 选中文声音
  const voices = window.speechSynthesis.getVoices();
  const zh = voices.find(v => v.lang.startsWith('zh'));
  if (zh) u.voice = zh;
  window.speechSynthesis.speak(u);
}

// Web Audio 播放电平分析
let audioCtx = null, analyser = null;
function setupAudioAnalyzer() {
  const audioEl = document.getElementById('audio');
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    analyser = audioCtx.createAnalyser();
    analyser.fftSize = 256;
    const src = audioCtx.createMediaElementSource(audioEl);
    src.connect(analyser);
    analyser.connect(audioCtx.destination);
  }
  const data = new Uint8Array(analyser.frequencyBinCount);
  const tick = () => {
    if (audioCtx && analyser) {
      analyser.getByteTimeDomainData(data);
      let peak = 0;
      for (let i = 0; i < data.length; i++) {
        const v = Math.abs(data[i] - 128) / 128;
        if (v > peak) peak = v;
      }
      document.getElementById('plfill').style.width = (peak * 100) + '%';
    }
    requestAnimationFrame(tick);
  };
  tick();
}
setTimeout(setupAudioAnalyzer, 1000);

// 帧率/延迟统计
let last = performance.now();
video.addEventListener('timeupdate', () => {
  const now = performance.now();
  if (now - last > 1000) {
    const fps = Math.round(1 / ((now - last)/1000 / Math.max(1, video.webkitDecodedFrames || 0)));
    last = now;
  }
});
</script>
</body>
</html>
